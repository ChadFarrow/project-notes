name: Cross-repo audit

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 09:00 ET (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate audit
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          OUT="audits/$(date -u +%Y-%m-%d).md"
          mkdir -p audits

          {
            echo "# Cross-repo audit — $(date -u +%Y-%m-%d)"
            echo

            echo "## Open pull requests"
            echo
            gh search prs --owner ChadFarrow --state open --limit 100 \
              --json repository,number,title,createdAt,isDraft,author \
              --template '{{range .}}- [ ] **{{.repository.name}} #{{.number}}** — {{.title}}{{if .isDraft}} _(draft)_{{end}} · opened {{timeago .createdAt}} by {{.author.login}}
          {{end}}'

            echo
            echo "## Open issues"
            echo
            gh search issues --owner ChadFarrow --state open --limit 100 \
              --json repository,number,title,createdAt,author,commentsCount \
              --template '{{range .}}- [ ] **{{.repository.name}} #{{.number}}** — {{.title}} · opened {{timeago .createdAt}} by {{.author.login}} ({{.commentsCount}} comments)
          {{end}}'

            echo
            echo "## Branches with no open PR"
            echo
            gh repo list ChadFarrow --limit 200 --no-archived \
              --json name --jq '.[].name' | while read -r repo; do

              # one call per repo, not per branch
              default=$(gh repo view "ChadFarrow/$repo" \
                --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null || echo "")

              # head branches of this repo's open PRs
              gh pr list --repo "ChadFarrow/$repo" --state open --limit 100 \
                --json headRefName --jq '.[].headRefName' > /tmp/pr_branches.txt 2>/dev/null \
                || : > /tmp/pr_branches.txt

              gh api "repos/ChadFarrow/$repo/branches" --paginate \
                --jq '.[].name' 2>/dev/null | while read -r br; do
                if [ "$br" = "$default" ]; then continue; fi
                if grep -qxF "$br" /tmp/pr_branches.txt; then continue; fi
                echo "- [ ] \`$repo\` — \`$br\`"
              done || true
            done

            echo
            echo "## Repos with no push in 180+ days (archive candidates)"
            echo
            cutoff=$(date -u -d '180 days ago' +%Y-%m-%d)
            gh repo list ChadFarrow --limit 200 --no-archived \
              --json name,pushedAt \
              --jq ".[] | select(.pushedAt < \"$cutoff\") | \"- [ ] \`\(.name)\` — last push \(.pushedAt[0:10])\""
          } > "$OUT"

          cp "$OUT" LATEST.md

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits LATEST.md
          git diff --staged --quiet || git commit -m "Audit $(date -u +%Y-%m-%d)"
          git push
