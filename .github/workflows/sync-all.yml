name: Sync All Project Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger; the web dashboard and the vault sync also start it
  push:
    # A change to the page or the generator redeploys the web dashboard. Not
    # projects/**: every Obsidian save would then start a run.
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/sync-all.yml'

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'  # matches the Mac; bump both together

      - name: Test
        run: node --test

      - name: Sync
        env:
          # AUDIT_TOKEN is a classic PAT with `repo` scope — it must read private repos.
          # scripts/sync.mjs probes it and falls back to GITHUB_TOKEN, which sees public
          # repos only; see pickToken in scripts/lib/github.mjs and CLAUDE.md.
          AUDIT_TOKEN: ${{ secrets.AUDIT_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The web dashboard is built outside the checkout, so `git add -A` below can
        # never commit it.
        run: node scripts/sync.mjs --site "$RUNNER_TEMP/site"

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Auto-sync $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1

      # After the push, so the site never shows data the repo does not have.
      - name: Upload the web dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    # Publishes the web dashboard at https://notes.podtards.com. A separate job: the
    # job that holds AUDIT_TOKEN gets no OIDC token, and a run on another branch skips
    # this instead of failing on the environment's main-only rule.
    needs: sync
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
