name: Sync All Project Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Everything
        env:
          # AUDIT_TOKEN is a PAT with cross-repo read — required for the owner-wide
          # `gh search` calls in the audit section. Falls back to the default token,
          # which can still generate everything except the audit.
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          USERNAME="ChadFarrow"

          # ========== SYNC REPOS & INDEX ==========
          echo "Fetching repos..."
          gh repo list $USERNAME --json name,description,primaryLanguage,updatedAt,isArchived,isFork --limit 100 > repos.json

          # Generate INDEX.md
          cat > INDEX.md << 'HEADER'
          # GitHub Projects

          *Auto-synced every 6 hours*

          HEADER

          # Categories — THE single source of truth for which repos are tracked.
          # To track a new repo, add it here (and nowhere else in this file).
          declare -A CATEGORIES
          CATEGORIES["Music/Podcasting"]="MSP-2.0 MSP-2.0-Desktop-App musicL-playlist-updater chadf-musicl-playlists Auto-musicL-Maker lnaddress-music castr.me RSS-music-site-template msp-podping-service"
          CATEGORIES["Lightning"]="ITDV-Lightning TRM-Lightning HPM-Lightning lnurl-test-feed libre-listener-wallet-monorepo"
          CATEGORIES["Nostr"]="Helipad-to-Nostr-BoostBot LIT_Bot LibreRelayBot BoostAfterBoost"
          CATEGORIES["Web/Apps"]="stablekraft-app chadf-landing-page boostmebitch web-ui localbitcoiners candr.space"
          CATEGORIES["Tools"]="HGH-checker"

          CATEGORY_ORDER=("Music/Podcasting" "Lightning" "Nostr" "Web/Apps" "Tools")

          # Derived from CATEGORIES — do not maintain separately
          REPOS=()
          for category in "${CATEGORY_ORDER[@]}"; do
            for repo in ${CATEGORIES[$category]}; do REPOS+=("$repo"); done
          done
          known_repos="project-notes ${REPOS[*]}"

          for category in "${CATEGORY_ORDER[@]}"; do
            echo "## $category" >> INDEX.md
            for repo in ${CATEGORIES[$category]}; do
              desc=$(jq -r --arg name "$repo" '.[] | select(.name == $name) | .description // "No description"' repos.json)
              lang=$(jq -r --arg name "$repo" '.[] | select(.name == $name) | .primaryLanguage.name // ""' repos.json)
              if [ -n "$lang" ]; then
                echo "- [$repo]($repo.md) - $desc (\`$lang\`)" >> INDEX.md
              else
                echo "- [$repo]($repo.md) - $desc" >> INDEX.md
              fi
            done
            echo "" >> INDEX.md
          done

          # Check for new repos not in categories
          echo "## Uncategorized" >> INDEX.md
          new_repos=$(jq -r '.[].name' repos.json | while read repo; do
            if [[ ! " $known_repos " =~ " $repo " ]]; then
              archived=$(jq -r --arg name "$repo" '.[] | select(.name == $name) | .isArchived' repos.json)
              if [ "$archived" != "true" ]; then
                echo "$repo"
              fi
            fi
          done)

          if [ -n "$new_repos" ]; then
            for repo in $new_repos; do
              desc=$(jq -r --arg name "$repo" '.[] | select(.name == $name) | .description // "No description"' repos.json)
              echo "- [$repo](https://github.com/$USERNAME/$repo) - $desc *(NEW)*" >> INDEX.md
            done
          else
            echo "*None*" >> INDEX.md
          fi

          cat >> INDEX.md << 'FOOTER'

          ---

          ## Quick Links
          - [Latest Audit](LATEST.md) - **Start here** — every open PR, issue, orphan branch and stale repo
          - [Audit History](audits/README.md) - Past sweeps

          ### Per-project detail (curated projects only)
          - [All Issues](ISSUES.md) - GitHub issues across all projects
          - [All Pull Requests](PULL_REQUESTS.md) - PRs across all projects
          - [All Branches](BRANCHES.md) - Active branches across all projects

          ### Reference
          - [PC2.0 Specs Reference](PC2.0-SPECS.md)
          - [References](references/README.md) - General bookmarks & links
          - [GitHub Profile](https://github.com/ChadFarrow)
          FOOTER

          # ========== SYNC ISSUES ==========
          echo "Syncing issues..."

          # REPOS is derived from CATEGORIES above

          cat > ISSUES.md << 'HEADER'
          # GitHub Issues

          *Auto-synced every 6 hours via GitHub Actions*

          *Scope: curated projects only. For all repos see [LATEST.md](LATEST.md).*

          HEADER

          for repo in "${REPOS[@]}"; do
            echo "## $repo" >> ISSUES.md
            echo "" >> ISSUES.md

            open_issues=$(gh issue list --repo $USERNAME/$repo --state open --json number,title,url --jq '.[] | "- [#\(.number) \(.title)](\(.url))"' 2>/dev/null || echo "")

            if [ -n "$open_issues" ]; then
              echo "### Open" >> ISSUES.md
              echo "$open_issues" >> ISSUES.md
              echo "" >> ISSUES.md
            else
              echo "*No open issues*" >> ISSUES.md
              echo "" >> ISSUES.md
            fi
          done

          echo "---" >> ISSUES.md
          echo "*Last synced: $(date -u '+%Y-%m-%d %H:%M UTC')*" >> ISSUES.md

          # ========== SYNC PULL REQUESTS ==========
          echo "Syncing pull requests..."

          cat > PULL_REQUESTS.md << 'HEADER'
          # Pull Requests

          *Auto-synced every 6 hours via GitHub Actions*

          *Scope: curated projects only. For all repos see [LATEST.md](LATEST.md).*

          HEADER

          for repo in "${REPOS[@]}"; do
            echo "## $repo" >> PULL_REQUESTS.md
            echo "" >> PULL_REQUESTS.md

            open_prs=$(gh pr list --repo $USERNAME/$repo --state open --json number,title,url --jq '.[] | "- [#\(.number) \(.title)](\(.url))"' 2>/dev/null || echo "")

            if [ -n "$open_prs" ]; then
              echo "$open_prs" >> PULL_REQUESTS.md
              echo "" >> PULL_REQUESTS.md
            else
              echo "*No open pull requests*" >> PULL_REQUESTS.md
              echo "" >> PULL_REQUESTS.md
            fi
          done

          echo "---" >> PULL_REQUESTS.md
          echo "*Last synced: $(date -u '+%Y-%m-%d %H:%M UTC')*" >> PULL_REQUESTS.md

          # ========== SYNC BRANCHES ==========
          echo "Syncing branches..."

          cat > BRANCHES.md << 'HEADER'
          # Branches

          *Auto-synced every 6 hours via GitHub Actions*

          *Scope: curated projects only. For all repos see [LATEST.md](LATEST.md).*

          HEADER

          for repo in "${REPOS[@]}"; do
            echo "## $repo" >> BRANCHES.md
            echo "" >> BRANCHES.md

            branches=$(gh api repos/$USERNAME/$repo/branches --paginate --jq '.[] | "- `\(.name)`\(if .protected then " 🔒" else "" end)"' 2>/dev/null || echo "")

            if [ -n "$branches" ]; then
              echo "$branches" >> BRANCHES.md
            else
              echo "*No branches found*" >> BRANCHES.md
            fi
            echo "" >> BRANCHES.md
          done

          echo "---" >> BRANCHES.md
          echo "*Last synced: $(date -u '+%Y-%m-%d %H:%M UTC')*" >> BRANCHES.md

          # ========== SYNC STARS ==========
          echo "Syncing stars..."
          gh api users/$USERNAME/starred --paginate --jq '.[] | {name: .name, url: .html_url, desc: .description, lang: .language, owner: .owner.login}' > stars.json

          cat > references/starred.md << 'HEADER'
          # Starred Repos

          *Auto-synced every 6 hours*

          HEADER

          # Group by category based on topics/language
          echo "## Nostr" >> references/starred.md
          jq -rs '.[] | select(.name | test("nostr|nip|amber|aegis|blossom|bloom|relay|jumble|vnak"; "i")) | "- [\(.name)](\(.url)) - \(.desc // "No description")"' stars.json >> references/starred.md || true
          echo "" >> references/starred.md

          echo "## Lightning" >> references/starred.md
          jq -rs '.[] | select(.name | test("lightning|lnurl|bolt|alby|coinos|breez|spark"; "i")) | "- [\(.name)](\(.url)) - \(.desc // "No description")"' stars.json >> references/starred.md || true
          echo "" >> references/starred.md

          echo "## Podcasting" >> references/starred.md
          jq -rs '.[] | select(.name | test("podcast|rss|feed|boost|v4v|podping"; "i")) | "- [\(.name)](\(.url)) - \(.desc // "No description")"' stars.json >> references/starred.md || true
          echo "" >> references/starred.md

          echo "## Other" >> references/starred.md
          jq -rs '.[] | select(.name | test("nostr|nip|amber|aegis|blossom|bloom|relay|jumble|vnak|lightning|lnurl|bolt|alby|coinos|breez|spark|podcast|rss|feed|boost|v4v|podping"; "i") | not) | "- [\(.name)](\(.url)) - \(.desc // "No description")"' stars.json >> references/starred.md || true

          echo "" >> references/starred.md
          echo "---" >> references/starred.md
          echo "*Last synced: $(date -u '+%Y-%m-%d %H:%M UTC')*" >> references/starred.md

          # ========== SYNC AUDIT ==========
          # Owner-wide sweep — covers ALL repos, not just the curated CATEGORIES above.
          # Requires AUDIT_TOKEN (a PAT); the default GITHUB_TOKEN cannot run `gh search`
          # across the whole account. Same-day runs overwrite audits/<date>.md in place,
          # so each dated file is that day's final snapshot.
          echo "Syncing audit..."
          OUT="audits/$(date -u +%Y-%m-%d).md"
          mkdir -p audits

          # A fork that isn't one of your curated projects is upstream code you're
          # tracking, not work you owe: its PRs are opened against the parent repo, so
          # every branch looks orphaned here and every quiet period looks like neglect.
          # Skip those. Forks that ARE curated (libre-listener-wallet-monorepo,
          # localbitcoiners, ...) still get audited — they're yours.
          #
          # AUDIT_SKIP is the manual escape hatch for curated repos the rule would
          # otherwise keep: web-ui and castr.me are forks you contribute to upstream
          # (e.g. web-ui's add-chad-apps shipped as Podcastindex-org/web-ui#557), so
          # their branches never get a PR in your copy.
          AUDIT_SKIP="castr.me web-ui"

          audit_skip() {
            local repo="$1" is_fork="$2"
            case " $AUDIT_SKIP " in *" $repo "*) return 0 ;; esac
            if [ "$is_fork" = "true" ]; then
              case " ${REPOS[*]} " in
                *" $repo "*) return 1 ;;
                *) return 0 ;;
              esac
            fi
            return 1
          }

          {
            echo "# Cross-repo audit — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo

            echo "## Open pull requests"
            echo
            gh search prs --owner $USERNAME --state open --limit 100 \
              --json repository,number,title,createdAt,isDraft,author \
              --template '{{range .}}- [ ] **{{.repository.name}} #{{.number}}** — {{.title}}{{if .isDraft}} _(draft)_{{end}} · opened {{timeago .createdAt}} by {{.author.login}}
          {{end}}'

            echo
            echo "## Open issues"
            echo
            gh search issues --owner $USERNAME --state open --limit 100 \
              --json repository,number,title,createdAt,author,commentsCount \
              --template '{{range .}}- [ ] **{{.repository.name}} #{{.number}}** — {{.title}} · opened {{timeago .createdAt}} by {{.author.login}} ({{.commentsCount}} comments)
          {{end}}'

            echo
            echo "## Branches with no open PR"
            echo
            gh repo list $USERNAME --limit 200 --no-archived \
              --json name,isFork --jq '.[] | "\(.name)\t\(.isFork)"' \
              | while IFS=$'\t' read -r repo is_fork; do

              audit_skip "$repo" "$is_fork" && continue

              # one call per repo, not per branch
              default=$(gh repo view "$USERNAME/$repo" \
                --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null || echo "")

              # head branches of this repo's open PRs
              gh pr list --repo "$USERNAME/$repo" --state open --limit 100 \
                --json headRefName --jq '.[].headRefName' > /tmp/pr_branches.txt 2>/dev/null \
                || : > /tmp/pr_branches.txt

              gh api "repos/$USERNAME/$repo/branches" --paginate \
                --jq '.[].name' 2>/dev/null | while read -r br; do
                if [ "$br" = "$default" ]; then continue; fi
                if grep -qxF "$br" /tmp/pr_branches.txt; then continue; fi
                echo "- [ ] \`$repo\` — \`$br\`"
              done || true
            done

            echo
            echo "## Repos with no push in 180+ days (archive candidates)"
            echo
            cutoff=$(date -u -d '180 days ago' +%Y-%m-%d)
            gh repo list $USERNAME --limit 200 --no-archived \
              --json name,pushedAt,isFork \
              --jq ".[] | select(.pushedAt < \"$cutoff\") | \"\(.name)\t\(.isFork)\t\(.pushedAt[0:10])\"" \
              | while IFS=$'\t' read -r repo is_fork pushed; do
              audit_skip "$repo" "$is_fork" && continue
              echo "- [ ] \`$repo\` — last push $pushed"
            done
          } > "$OUT"

          cp "$OUT" LATEST.md

          # Audit history index
          {
            echo "# Audit History"
            echo
            echo "Point-in-time cross-repo sweeps. [LATEST.md](../LATEST.md) is a copy of the newest entry."
            echo
            ls -1 audits/*.md 2>/dev/null | grep -v 'README' | sort -r | while read -r f; do
              echo "- [$(basename "$f" .md)]($(basename "$f"))"
            done
          } > audits/README.md

          # Cleanup
          rm -f repos.json stars.json /tmp/pr_branches.txt

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Auto-sync $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
