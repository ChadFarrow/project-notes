name: Sync All Project Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'  # matches the Mac; bump both together

      - name: Test
        run: node --test

      - name: Sync
        env:
          # AUDIT_TOKEN is a classic PAT with `repo` scope — it must read private repos.
          # scripts/sync.mjs probes it and falls back to GITHUB_TOKEN, which sees public
          # repos only; see pickToken in scripts/lib/github.mjs and CLAUDE.md.
          AUDIT_TOKEN: ${{ secrets.AUDIT_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync.mjs

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Auto-sync $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
